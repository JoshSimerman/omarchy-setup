name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck every tracked shell script
        # All scripts here are bash, including the extensionless ones found
        # by shebang and the sourced .bash_profile snippet.
        run: |
          { git ls-files '*.sh' '*.hook'; git grep -lE '^#!.*\bbash\b' -- ':!*.md'; } \
            | sort -u | xargs shellcheck --shell=bash --external-sources
