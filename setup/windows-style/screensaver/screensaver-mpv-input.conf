# mpv bindings for the screensaver: any typed key, named key, click, or scroll
# quits. Loaded with --input-default-bindings=no, so nothing else is bound.
# (UNMAPPED is not used: it also fires on startup events and closed the
# screensaver immediately.)
ANY_UNICODE quit
ESC quit
ENTER quit
KP_ENTER quit
SPACE quit
BS quit
TAB quit
DEL quit
INS quit
HOME quit
END quit
PGUP quit
PGDWN quit
UP quit
DOWN quit
LEFT quit
RIGHT quit
PRINT quit
PAUSE quit
F1 quit
F2 quit
F3 quit
F4 quit
F5 quit
F6 quit
F7 quit
F8 quit
F9 quit
F10 quit
F11 quit
F12 quit
MBTN_LEFT quit
MBTN_RIGHT quit
MBTN_MID quit
MBTN_BACK quit
MBTN_FORWARD quit
WHEEL_UP quit
WHEEL_DOWN quit
WHEEL_LEFT quit
WHEEL_RIGHT quit
